[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "product-tracker"
version = "0.1.0"
description = "Product price tracking system with web scrapers and FastAPI REST API"
authors = ["pattersonrptr"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.120.4"
uvicorn = "^0.38.0"
sqlalchemy = "^2.0.44"
alembic = "^1.17.1"
psycopg2-binary = "^2.9.11"
pydantic = "^2.12.3"
python-jose = "^3.5.0"
passlib = "^1.7.4"
bcrypt = "^3.2.2"
python-dotenv = "^1.0.0"
python-multipart = "^0.0.20"
email-validator = "^2.3.0"
requests = "^2.32.5"
sendgrid = "^6.12.5"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
pytest-asyncio = "^1.3.0"
pytest-cov = "^7.0.0"
ruff = "^0.8.6"
mypy = "^1.13.0"
pre-commit = "^4.0.1"
types-requests = "^2.32.4"
types-passlib = "^1.7.7"
types-python-jose = "^3.3.4"
httpx = "^0.28.1"

[tool.ruff]
# Match project's current line length
line-length = 88
indent-width = 4

# Python 3.11+
target-version = "py311"

# Directories to ignore
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "htmlcov",
    ".pytest_cache",
    "alembic/versions",
    "logs",
]

[tool.ruff.lint]
# Enabled rules
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (imports)
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

# Ignored rules (adjust as needed)
ignore = [
    "E501",  # line-too-long (already controlled by formatter)
    "B008",  # do-not-perform-function-calls-in-argument-defaults (common in FastAPI)
]

# Allow autofixing
fixable = ["ALL"]
unfixable = []

# Allow unused imports in __init__.py files
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# TestingSessionLocal is SQLAlchemy convention (sessionmaker returns a class)
"src/tests/*/conftest.py" = ["N806"]
"src/tests/*/test_*.py" = ["N806"]

[tool.ruff.lint.isort]
# isort configuration for organizing imports
known-first-party = ["src", "app", "config", "common"]

[tool.ruff.format]
# Formatter configuration
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
# Basic configuration
python_version = "3.11"
warn_return_any = false  # Too noisy for now
warn_unused_configs = true
disallow_untyped_defs = false  # Start permissive, tighten later
disallow_any_unimported = false
no_implicit_optional = false  # Allow implicit Optional for now
warn_redundant_casts = true
warn_unused_ignores = false  # Don't warn about unused ignores
warn_no_return = true
check_untyped_defs = true
strict_optional = false  # More permissive with None checks

# Output
show_error_codes = true
show_column_numbers = true
show_error_context = true
pretty = true

# Import discovery
namespace_packages = true
mypy_path = "src"
files = ["src"]

# Exclude patterns
exclude = [
    "alembic/",
    "htmlcov/",
    "logs/",
    ".venv/",
    "venv/",
    "__pycache__/",
]

# Per-module options
[[tool.mypy.overrides]]
module = [
    "jose.*",
    "passlib.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "scripts.*",
]
ignore_errors = true

# Strict checking for core modules (auth, users)
[[tool.mypy.overrides]]
module = [
    "app.use_cases.*",
    "app.domain.*",
    "app.entities.*",
]
warn_return_any = true
disallow_untyped_defs = false  # Will enable later incrementally

[tool.bandit]
# Security scanner configuration
exclude_dirs = [
    "tests",
    "alembic",
    ".venv",
    "venv",
]
skips = [
    "B101",  # assert_used - we use asserts in tests
    "B601",  # paramiko_calls - not applicable
]
