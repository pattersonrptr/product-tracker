[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "product-tracker-scrapers"
version = "0.1.0"
description = "Celery workers and web scrapers for the Product Tracker system"
authors = ["pattersonrptr"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
celery = "^5.5.3"
flower = "^2.0.1"
redis = "^5.2.1"
requests = "^2.32.5"
beautifulsoup4 = "^4.14.2"
cloudscraper = "^1.2.71"
playwright = "^1.50"
python-dotenv = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
pytest-asyncio = "^0.24"
pytest-cov = "^7.0.0"
ruff = "^0.8.6"

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py311"

exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (imports)
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

ignore = [
    "E501",  # line-too-long (already controlled by formatter)
]

fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
