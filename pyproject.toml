[tool.ruff]
# Match project's current line length
line-length = 88
indent-width = 4

# Python 3.11+
target-version = "py311"

# Directories to ignore
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "htmlcov",
    ".pytest_cache",
    "alembic/versions",
    "logs",
]

[tool.ruff.lint]
# Enabled rules
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (imports)
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

# Ignored rules (adjust as needed)
ignore = [
    "E501",  # line-too-long (already controlled by formatter)
    "B008",  # do-not-perform-function-calls-in-argument-defaults (common in FastAPI)
]

# Allow autofixing
fixable = ["ALL"]
unfixable = []

# Allow unused imports in __init__.py files
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Future code with models not yet implemented (legacy from old project)
"src/product_scrapers/celery/beat_schedule.py" = ["F821"]
"src/scripts/load_fixtures.py" = ["F821"]
# TestingSessionLocal is SQLAlchemy convention (sessionmaker returns a class)
"src/tests/*/conftest.py" = ["N806"]
"src/tests/*/test_*.py" = ["N806"]

[tool.ruff.lint.isort]
# isort configuration for organizing imports
known-first-party = ["src", "app", "config", "common", "product_scrapers"]

[tool.ruff.format]
# Formatter configuration
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
