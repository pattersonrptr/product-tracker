services:
  web:
    build: .
    container_name: web
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/price_monitor
      - PYTHONPATH=/src
    volumes:
      - ./alembic:/src/alembic
      - .:/src
    command: ./start.sh

  scraper:
    build: .
    container_name: scraper
    depends_on:
      - db
      - redis
      - web
    environment:
      - API_URL=http://web:8000
      - DATABASE_URL=postgresql://user:password@db:5432/price_monitor
      - CELERY_BROKER_URL=redis://redis:6379/0
      - PYTHONPATH=/src
      - CELERY_WORKER_USERNAME=celery_user
      - CELERY_WORKER_PASSWORD=celery_user_password
    volumes:
      - ./alembic:/src/alembic
      - .:/src
    command:
      [
        "/bin/sh",
        "-c",
        "celery multi start 8 -A src.product_scrapers.celery.tasks --loglevel=info --concurrency=2 --detach && tail -f /dev/null",
      ]

  flower:
    build: .
    container_name: flower
    depends_on:
      - redis
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    ports:
      - "5555:5555"
    command: celery -A src.product_scrapers.celery.tasks flower --port=5555

  celery-beat:
    build: .
    container_name: celery-beat
    depends_on:
      - scraper
      - redis
    environment:
      - API_URL=http://web:8000
      - DATABASE_URL=postgresql://user:password@db:5432/price_monitor
      - CELERY_BROKER_URL=redis://redis:6379/0
      - PYTHONPATH=/src
    command: celery -A src.product_scrapers.celery.tasks beat --loglevel=info

  db:
    image: postgres:13
    container_name: db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: price_monitor
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
