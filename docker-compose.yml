services:
  # ── Backend API ──────────────────────────────────────────────────────────
  web:
    build:
      context: ./backend
      args:
        BUILD_ENV: dev
    container_name: web
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/price_monitor
      - PYTHONPATH=/src
      - CELERY_WORKER_USERNAME=celery_user
      - CELERY_WORKER_PASSWORD=celery_user_password
    volumes:
      - ./backend/alembic:/src/alembic
      - ./backend:/src
    command: ./start.sh

  # ── Scraper Workers ──────────────────────────────────────────────────────
  scraper:
    build:
      context: ./scrapers
      args:
        BUILD_ENV: dev
    container_name: scraper
    depends_on:
      - db
      - redis
      - web
    environment:
      - API_URL=http://web:8000
      - CELERY_BROKER_URL=redis://redis:6379/0
      - PYTHONPATH=/src
      - CELERY_WORKER_USERNAME=celery_user
      - CELERY_WORKER_PASSWORD=celery_user_password
      # Residential proxy for Mercado Livre (optional — disabled by default)
      - PROXY_ENABLED=${PROXY_ENABLED:-false}
      - PROXY_SERVER=${PROXY_SERVER:-}
      - PROXY_USERNAME=${PROXY_USERNAME:-}
      - PROXY_PASSWORD=${PROXY_PASSWORD:-}
    deploy:
      resources:
        limits:
          memory: 16G
    volumes:
      - ./scrapers:/src
    command:
      [
        "celery",
        "-A",
        "src.celery.tasks",
        "worker",
        "--loglevel=info",
        "--concurrency=4",
        "--pool=prefork",
        "--hostname=scraper@%h",
      ]

  # ── Celery Beat (Scheduler) ─────────────────────────────────────────────
  celery-beat:
    build:
      context: ./scrapers
      args:
        BUILD_ENV: dev
    container_name: celery-beat
    depends_on:
      - scraper
      - redis
      - web
    environment:
      - API_URL=http://web:8000
      - CELERY_BROKER_URL=redis://redis:6379/0
      - PYTHONPATH=/src
      - CELERY_WORKER_USERNAME=celery_user
      - CELERY_WORKER_PASSWORD=celery_user_password
      # Residential proxy for Mercado Livre (optional — disabled by default)
      - PROXY_ENABLED=${PROXY_ENABLED:-false}
      - PROXY_SERVER=${PROXY_SERVER:-}
      - PROXY_USERNAME=${PROXY_USERNAME:-}
      - PROXY_PASSWORD=${PROXY_PASSWORD:-}
    volumes:
      - ./scrapers:/src
    command: celery -A src.celery.tasks beat --loglevel=info

  # ── Flower (Celery Monitoring) ───────────────────────────────────────────
  flower:
    build:
      context: ./scrapers
    container_name: flower
    depends_on:
      - redis
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    ports:
      - "5555:5555"
    command: celery -A src.celery.tasks flower --port=5555

  # ── PostgreSQL ───────────────────────────────────────────────────────────
  db:
    image: postgres:13
    container_name: db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: price_monitor
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # ── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"

  # ── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    image: product-tracker-front
    container_name: product-tracker-front
    ports:
      - "80:80"
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:
