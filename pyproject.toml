[tool.ruff]
# Match project's current line length
line-length = 88
indent-width = 4

# Python 3.11+
target-version = "py311"

# Directories to ignore
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "htmlcov",
    ".pytest_cache",
    "alembic/versions",
    "logs",
]

[tool.ruff.lint]
# Enabled rules
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (imports)
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

# Ignored rules (adjust as needed)
ignore = [
    "E501",  # line-too-long (already controlled by formatter)
    "B008",  # do-not-perform-function-calls-in-argument-defaults (common in FastAPI)
]

# Allow autofixing
fixable = ["ALL"]
unfixable = []

# Allow unused imports in __init__.py files
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Future code with models not yet implemented (legacy from old project)
"src/product_scrapers/celery/beat_schedule.py" = ["F821"]
"src/scripts/load_fixtures.py" = ["F821"]
# TestingSessionLocal is SQLAlchemy convention (sessionmaker returns a class)
"src/tests/*/conftest.py" = ["N806"]
"src/tests/*/test_*.py" = ["N806"]

[tool.ruff.lint.isort]
# isort configuration for organizing imports
known-first-party = ["src", "app", "config", "common", "product_scrapers"]

[tool.ruff.format]
# Formatter configuration
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
# Basic configuration
python_version = "3.11"
warn_return_any = false  # Too noisy for now
warn_unused_configs = true
disallow_untyped_defs = false  # Start permissive, tighten later
disallow_any_unimported = false
no_implicit_optional = false  # Allow implicit Optional for now
warn_redundant_casts = true
warn_unused_ignores = false  # Don't warn about unused ignores
warn_no_return = true
check_untyped_defs = true
strict_optional = false  # More permissive with None checks

# Output
show_error_codes = true
show_column_numbers = true
show_error_context = true
pretty = true

# Import discovery
namespace_packages = true
mypy_path = "src"
files = ["src"]

# Exclude patterns
exclude = [
    "alembic/",
    "htmlcov/",
    "logs/",
    ".venv/",
    "venv/",
    "__pycache__/",
]

# Per-module options
[[tool.mypy.overrides]]
module = [
    "jose.*",
    "passlib.*",
    "celery.*",
    "cloudscraper.*",
    "bs4.*",
]
ignore_missing_imports = true

# Ignore legacy scrapers code (will be refactored later)
[[tool.mypy.overrides]]
module = [
    "product_scrapers.api.*",
    "product_scrapers.scrapers.*",
    "product_scrapers.celery.*",
    "scripts.*",
]
ignore_errors = true

# Strict checking for core modules (auth, users)
[[tool.mypy.overrides]]
module = [
    "app.use_cases.*",
    "app.domain.*",
    "app.entities.*",
]
warn_return_any = true
disallow_untyped_defs = false  # Will enable later incrementally
