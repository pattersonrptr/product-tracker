# Pre-commit hooks configuration
# See https://pre-commit.com for more information
# Monorepo layout: backend/, scrapers/, frontend/

repos:
  # Ruff - Fast Python linter and formatter (backend + scrapers)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^(backend|scrapers)/
      - id: ruff-format
        files: ^(backend|scrapers)/

  # MyPy - Static type checker (backend only, non-blocking)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        args: [--config-file=backend/pyproject.toml, --ignore-missing-imports]
        files: ^backend/
        additional_dependencies:
          - types-requests
          - types-passlib
          - types-python-jose
          - pydantic
          - fastapi
          - sqlalchemy
        verbose: true
        stages: [manual]

  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements
      - id: mixed-line-ending

  # Security checks (backend only, non-blocking)
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        args: [-c, backend/pyproject.toml]
        files: ^backend/
        additional_dependencies: ["bandit[toml]"]
        stages: [manual]
